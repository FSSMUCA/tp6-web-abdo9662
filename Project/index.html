<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Interactive Calculator</h1>
</header>

<main>
    <section class="calculator">
        <form id="calcForm">
            <div class="form-group">
                <label for="numberA">Number A:</label>
                <input type="number" id="numberA" required>
            </div>
            <div class="form-group">
                <label for="numberB">Number B:</label>
                <input type="number" id="numberB" required>
            </div>
            <div class="form-group">
                <label for="operation">Operation:</label>
                <select id="operation">
                    <option value="+">+</option>
                    <option value="-">−</option>
                    <option value="*">×</option>
                    <option value="/">÷</option>
                </select>
            </div>
            <button type="submit">Calculate</button>
        </form>

        <div id="errorMsg"></div>

        <section class="history">
            <h2>History of Operations</h2>
            <ul id="historyList"></ul>
        </section>
    </section>
</main>

<footer>
    &copy; 2025 My Web Project |

</footer>

<script src="app.js"></script>
</body>
</html>
